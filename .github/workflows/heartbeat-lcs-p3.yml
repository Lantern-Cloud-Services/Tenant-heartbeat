name: Weekly heartbeat - LCS P3

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      what_if:
        description: Run a what-if preview instead of an actual deployment.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: heartbeat-lcs-p3
  cancel-in-progress: false

jobs:
  heartbeat:
    uses: ./.github/workflows/heartbeat.yml
    with:
      tenant_nickname: LCS P3
      environment: lcs-p3
      what_if: ${{ inputs.what_if == true }}
