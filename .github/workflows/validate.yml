name: Validate IaC

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep-build:
    name: Build Bicep templates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build and lint templates
        run: az bicep build --file infra/heartbeat.bicep --stdout > /dev/null
